<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>講義マスター進捗管理</title>
<style>
  :root {
    --bg: #0f0f13;
    --surface: #17171e;
    --surface2: #1e1e28;
    --border: #2a2a38;
    --corp-accent: #4f8fff;
    --corp-dim: #1a2a4a;
    --inh-accent: #b06aff;
    --inh-dim: #2a1a4a;
    --done-green: #3ecf8e;
    --text: #e8e8f0;
    --text-sub: #888899;
    --text-dim: #444455;
  }

- { box-sizing: border-box; margin: 0; padding: 0; }

body {
background: var(–bg);
color: var(–text);
font-family: ‘Noto Sans JP’, ‘Hiragino Sans’, ‘Hiragino Kaku Gothic ProN’, sans-serif;
font-size: 14px;
min-height: 100vh;
padding-top: env(safe-area-inset-top);
}

/* ── Header ── */
.header {
padding: 16px 20px 16px;
border-bottom: 1px solid var(–border);
position: sticky;
top: 0;
background: #0f0f13;
z-index: 100;
}
.header-top {
display: flex;
justify-content: space-between;
align-items: flex-start;
gap: 12px;
flex-wrap: wrap;
}
.title-block h1 {
font-size: 18px;
font-weight: 700;
letter-spacing: 0.05em;
}
.title-block p {
font-size: 11px;
color: var(–text-sub);
margin-top: 2px;
font-family: ‘DM Mono’, monospace;
}

.deadline-badge {
font-family: ‘DM Mono’, monospace;
font-size: 11px;
background: var(–surface2);
border: 1px solid var(–border);
border-radius: 6px;
padding: 6px 12px;
color: var(–text-sub);
white-space: nowrap;
}
.deadline-badge span { color: #ff9f4a; font-weight: 500; }

/* ── Overall progress ── */
.progress-bar-wrap {
margin-top: 14px;
display: flex;
gap: 12px;
align-items: center;
}
.progress-bar {
flex: 1;
height: 6px;
background: var(–border);
border-radius: 99px;
overflow: hidden;
}
.progress-bar-fill {
height: 100%;
border-radius: 99px;
background: linear-gradient(90deg, var(–corp-accent), var(–inh-accent));
transition: width 0.4s ease;
}
.progress-label {
font-family: ‘DM Mono’, monospace;
font-size: 12px;
color: var(–text-sub);
white-space: nowrap;
}
.progress-label strong { color: var(–done-green); }

/* ── Tab bar ── */
.tabs {
display: flex;
gap: 4px;
padding: 12px 20px 0;
border-bottom: 1px solid var(–border);
background: var(–bg);
position: sticky;
top: 87px;
z-index: 99;
}
.tab {
padding: 8px 18px;
border-radius: 8px 8px 0 0;
border: 1px solid transparent;
border-bottom: none;
cursor: pointer;
font-size: 13px;
font-weight: 500;
color: var(–text-sub);
background: none;
transition: all 0.2s;
font-family: ‘Noto Sans JP’, sans-serif;
}
.tab.active-corp {
background: var(–corp-dim);
border-color: var(–corp-accent);
color: var(–corp-accent);
}
.tab.active-inh {
background: var(–inh-dim);
border-color: var(–inh-accent);
color: var(–inh-accent);
}
.tab:hover:not(.active-corp):not(.active-inh) { color: var(–text); }

/* ── Content ── */
.content { padding: 16px 20px 60px; }
.section-header {
display: flex;
align-items: center;
gap: 10px;
margin: 20px 0 10px;
}
.section-header h2 {
font-size: 13px;
font-weight: 700;
letter-spacing: 0.1em;
text-transform: uppercase;
color: var(–text-sub);
}
.section-pill {
font-family: ‘DM Mono’, monospace;
font-size: 10px;
padding: 2px 8px;
border-radius: 99px;
border: 1px solid;
}
.pill-corp { border-color: var(–corp-accent); color: var(–corp-accent); background: var(–corp-dim); }
.pill-inh  { border-color: var(–inh-accent);  color: var(–inh-accent);  background: var(–inh-dim); }

/* ── Lecture card ── */
.lecture-card {
background: var(–surface);
border: 1px solid var(–border);
border-radius: 10px;
margin-bottom: 8px;
overflow: hidden;
transition: border-color 0.2s;
}
.lecture-card.done { border-color: var(–done-green); opacity: 0.75; }
.lecture-card.done .card-header { background: rgba(62,207,142,0.05); }

.card-header {
display: flex;
align-items: center;
gap: 10px;
padding: 10px 14px;
cursor: pointer;
user-select: none;
}
.card-num {
font-family: ‘DM Mono’, monospace;
font-size: 11px;
font-weight: 500;
color: var(–text-dim);
min-width: 32px;
}
.card-title {
flex: 1;
font-size: 13px;
line-height: 1.5;
}
.card-badges {
display: flex;
gap: 6px;
align-items: center;
flex-shrink: 0;
flex-wrap: wrap;
justify-content: flex-end;
}
.badge {
font-family: ‘DM Mono’, monospace;
font-size: 10px;
padding: 2px 7px;
border-radius: 4px;
border: 1px solid var(–border);
color: var(–text-sub);
white-space: nowrap;
}
.badge.done-badge { border-color: var(–done-green); color: var(–done-green); background: rgba(62,207,142,0.08); }
.badge.partial-badge { border-color: #ffd166; color: #ffd166; background: rgba(255,209,102,0.08); }

.expand-icon {
color: var(–text-dim);
font-size: 12px;
transition: transform 0.2s;
margin-left: 4px;
}
.card-header.open .expand-icon { transform: rotate(180deg); }

/* ── Expand panel ── */
.card-body {
display: none;
padding: 0 14px 14px;
border-top: 1px solid var(–border);
}
.card-body.open { display: block; }

.check-row {
display: flex;
align-items: center;
gap: 10px;
margin-top: 10px;
flex-wrap: wrap;
}
.check-label {
font-size: 12px;
color: var(–text-sub);
min-width: 90px;
}
.check-toggle {
appearance: none;
width: 36px;
height: 20px;
border-radius: 99px;
background: var(–border);
cursor: pointer;
position: relative;
transition: background 0.2s;
flex-shrink: 0;
}
.check-toggle::after {
content: ‘’;
position: absolute;
top: 3px; left: 3px;
width: 14px; height: 14px;
border-radius: 50%;
background: var(–text-sub);
transition: all 0.2s;
}
.check-toggle:checked { background: var(–done-green); }
.check-toggle:checked::after { left: 19px; background: #fff; }

.date-input {
background: var(–surface2);
border: 1px solid var(–border);
border-radius: 6px;
color: var(–text);
font-family: ‘DM Mono’, monospace;
font-size: 12px;
padding: 4px 8px;
width: 130px;
transition: border-color 0.2s;
}
.date-input:focus { outline: none; border-color: var(–done-green); }

.training-input {
background: var(–surface2);
border: 1px solid var(–border);
border-radius: 6px;
color: var(–text);
font-size: 12px;
padding: 4px 8px;
width: 170px;
font-family: ‘Noto Sans JP’, sans-serif;
transition: border-color 0.2s;
}
.training-input:focus { outline: none; border-color: var(–inh-accent); }
.training-input::placeholder { color: var(–text-dim); }

/* ── Mini progress per section ── */
.mini-progress {
display: flex;
align-items: center;
gap: 8px;
margin-left: auto;
}
.mini-bar {
width: 60px;
height: 4px;
background: var(–border);
border-radius: 99px;
overflow: hidden;
}
.mini-bar-fill { height: 100%; border-radius: 99px; transition: width 0.3s; }
.mini-bar-fill.corp { background: var(–corp-accent); }
.mini-bar-fill.inh  { background: var(–inh-accent); }
.mini-pct {
font-family: ‘DM Mono’, monospace;
font-size: 10px;
color: var(–text-sub);
min-width: 28px;
text-align: right;
}

/* hidden tab */
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* Save notice */
.save-notice {
position: fixed;
bottom: 16px;
right: 16px;
background: var(–surface2);
border: 1px solid var(–done-green);
color: var(–done-green);
font-size: 11px;
padding: 6px 14px;
border-radius: 6px;
opacity: 0;
transition: opacity 0.3s;
font-family: ‘DM Mono’, monospace;
z-index: 200;
}
.save-notice.show { opacity: 1; }
</style>

</head>

// ─────────────────────────────────────────────
//  STATE  (localStorage)
// ─────────────────────────────────────────────
function loadState() {
  try { return JSON.parse(localStorage.getItem('study_tracker_v2') || '{}'); } catch { return {}; }
}
function saveState(s) {
  localStorage.setItem('study_tracker_v2', JSON.stringify(s));
  const el = document.getElementById('save-notice');
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 1500);
}

let state = loadState();

function getLS(id) {
  return state[id] || { textDone: false, textDate: '', trainDone: false, trainDate: '', trainNums: '' };
}
function setLS(id, key, val) {
  if (!state[id]) state[id] = getLS(id);
  state[id][key] = val;
  saveState(state);
  updateAll();
}

// ─────────────────────────────────────────────
//  RENDER
// ─────────────────────────────────────────────
function groupBy(arr, key) {
  const map = {};
  arr.forEach(x => { (map[x[key]] = map[x[key]] || []).push(x); });
  return map;
}

function cardDone(id) {
  const s = getLS(id);
  return s.textDone && s.trainDone;
}
function cardPartial(id) {
  const s = getLS(id);
  return s.textDone || s.trainDone;
}

function renderPanel(data, panelId, accent) {
  const panel = document.getElementById(panelId);
  const books = groupBy(data, 'book');
  let html = '';
  Object.entries(books).forEach(([book, lectures]) => {
    const total = lectures.length;
    const done  = lectures.filter(l => cardDone(l.id)).length;
    html += `
      <div class="section-header">
        <h2>${book}</h2>
        <div class="mini-progress">
          <div class="mini-bar"><div class="mini-bar-fill ${accent}" id="mini-${panelId}-${book.replace(/\s/g,'')}" style="width:${(done/total*100).toFixed(0)}%"></div></div>
          <span class="mini-pct" id="mpct-${panelId}-${book.replace(/\s/g,'')}">${done}/${total}</span>
        </div>
      </div>`;
    lectures.forEach(lec => {
      const s   = getLS(lec.id);
      const done = cardDone(lec.id);
      const part = cardPartial(lec.id);
      const textB = s.textDone  ? `<span class="badge done-badge">テキスト✓</span>` : (s.trainDone ? `<span class="badge partial-badge">一部完了</span>` : '');
      const trainB = s.trainDone ? `<span class="badge done-badge">トレーニング✓</span>` : '';
      html += `
        <div class="lecture-card ${done ? 'done' : ''}" id="card-${lec.id}">
          <div class="card-header" onclick="toggleCard('${lec.id}')">
            <span class="card-num">${lec.num}</span>
            <span class="card-title">${lec.title}</span>
            <div class="card-badges" id="badges-${lec.id}">${textB}${trainB}</div>
            <span class="expand-icon" id="exp-${lec.id}">▼</span>
          </div>
          <div class="card-body" id="body-${lec.id}">
            <div class="check-row">
              <span class="check-label">📖 テキスト</span>
              <input type="checkbox" class="check-toggle" ${s.textDone ? 'checked' : ''} onchange="setLS('${lec.id}','textDone',this.checked)">
              <input type="date" class="date-input" value="${s.textDate}" onchange="setLS('${lec.id}','textDate',this.value)" placeholder="完了日">
            </div>
            <div class="check-row">
              <span class="check-label">✏️ トレーニング</span>
              <input type="checkbox" class="check-toggle" ${s.trainDone ? 'checked' : ''} onchange="setLS('${lec.id}','trainDone',this.checked)">
              <input type="date" class="date-input" value="${s.trainDate}" onchange="setLS('${lec.id}','trainDate',this.value)" placeholder="完了日">
            </div>
            <div class="check-row">
              <span class="check-label">問題番号メモ</span>
              <input type="text" class="training-input" value="${s.trainNums}" onchange="setLS('${lec.id}','trainNums',this.value)" placeholder="例: 問題1〜12">
            </div>
          </div>
        </div>`;
    });
  });
  panel.innerHTML = html;
}

function toggleCard(id) {
  const body = document.getElementById('body-' + id);
  const hdr  = body.previousElementSibling;
  const exp  = document.getElementById('exp-' + id);
  const open = body.classList.toggle('open');
  hdr.classList.toggle('open', open);
}

function updateAll() {
  const all = [...CORP, ...INH];
  const totalDone = all.filter(l => cardDone(l.id)).length;
  document.getElementById('total-done').textContent = totalDone;
  document.getElementById('total-all').textContent  = all.length;
  document.getElementById('total-fill').style.width = (totalDone / all.length * 100).toFixed(1) + '%';

  // Re-render cards (badges + done class)
  [...CORP, ...INH].forEach(lec => {
    const card = document.getElementById('card-' + lec.id);
    if (!card) return;
    const done = cardDone(lec.id);
    card.classList.toggle('done', done);
    const s = getLS(lec.id);
    const textB  = s.textDone  ? `<span class="badge done-badge">テキスト✓</span>` : (s.trainDone ? `<span class="badge partial-badge">一部完了</span>` : '');
    const trainB = s.trainDone ? `<span class="badge done-badge">トレーニング✓</span>` : '';
    document.getElementById('badges-' + lec.id).innerHTML = textB + trainB;
  });

  // Mini progress
  const corpBooks = groupBy(CORP, 'book');
  Object.entries(corpBooks).forEach(([book, lectures]) => {
    const done = lectures.filter(l => cardDone(l.id)).length;
    const key = book.replace(/\s/g,'');
    const fill = document.getElementById('mini-panel-corp-' + key);
    const pct  = document.getElementById('mpct-panel-corp-' + key);
    if (fill) fill.style.width = (done/lectures.length*100).toFixed(0) + '%';
    if (pct)  pct.textContent  = `${done}/${lectures.length}`;
  });
  const inhBooks = groupBy(INH, 'book');
  Object.entries(inhBooks).forEach(([book, lectures]) => {
    const done = lectures.filter(l => cardDone(l.id)).length;
    const key = book.replace(/\s/g,'');
    const fill = document.getElementById('mini-panel-inh-' + key);
    const pct  = document.getElementById('mpct-panel-inh-' + key);
    if (fill) fill.style.width = (done/lectures.length*100).toFixed(0) + '%';
    if (pct)  pct.textContent  = `${done}/${lectures.length}`;
  });
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.className = 'tab');
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  if (tab === 'corp') {
    document.querySelectorAll('.tab')[0].className = 'tab active-corp';
    document.getElementById('panel-corp').classList.add('active');
  } else {
    document.querySelectorAll('.tab')[1].className = 'tab active-inh';
    document.getElementById('panel-inh').classList.add('active');
  }
}

// Deadline countdown
function updateDeadline() {
  const deadline = new Date('2026-11-30');
  const now = new Date();
  const diff = Math.ceil((deadline - now) / 86400000);
  document.getElementById('days-left').textContent = diff > 0 ? diff : 0;
}

// ─────────────────────────────────────────────
//  INIT
// ─────────────────────────────────────────────
renderPanel(CORP, 'panel-corp', 'corp');
renderPanel(INH,  'panel-inh',  'inh');
updateAll();
updateDeadline();
</script>
